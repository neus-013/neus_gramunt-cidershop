<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruity Cider Shop</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/cart.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="cart-container">
        <h2 class="cart-title" data-translate="shopping_cart">Shopping Cart</h2>
        <div class="cart-items">  
            <!-- Example of a cart item -->
            <div class="cart-item template" style="display: none;">
                <img src="" alt="" class="cart-item-img">
                <div class="cart-item-details">
                    <h3 class="cart-item-name"></h3>
                    <p class="cart-item-price"></p>
                </div>
                <div class="item-btns">
                    <div class="plus-minus-btns">
                        <button class="minus-item-btn" >-</button>  
                        <p class="cart-item-quantity"></p>
                        <button class="plus-item-btn" >+</button>  
                    </div>
                    <button class="remove-item-btn" data-translate="remove">Remove</button>     
                </div>
            </div> 
        </div>  
        <div class="cart-summary">
            <p class="total-price" data-translate="total">Total: 0€</p>
            <button class="checkout-btn" data-translate="checkout">Checkout</button>    
        </div>
        <div class="place-order">
            <button class="place-order-btn" data-translate="place_order">Place Order</button>
        </div>
    </section>
    <div id="footer-placeholder"></div>
    <script src="/js/main.js"></script>
    <script src="/js/language-swithcher.js"></script>
    <script type="module" src="/js/cart.js"></script>
</body>
</html>

<script type="module" src="/js/cart.js"></script>
