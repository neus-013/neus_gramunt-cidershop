<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruity Cider Shop</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/product-detail.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="product-description">
        <div class="product-imgs">
            <img src="/img/pear-can.png" alt="Pear can" class="product-img">
            <img src="/img/apple-can.png" alt="Apple can" class="product-img">
            <img src="/img/exotic-can.png" alt="Exotic can" class="product-img">
        </div>
        <div class="product-text">
            <div class="product-header">
                <h2 class="product-name" id="product-name"></h2>
                <p class="product-price" ></p>
            </div>
            <div class="add-to-cart">
                <select class="quantity-select">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
                <button id="btn-add-cart" class="add-btn" data-translate="add_to_cart">ADD TO CART</button>
            </div>
            <div class="product-desc">
                <p class="title-desc" data-translate="description">Description</p>
                <p class="prd-desc"></p>
                </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>


    <script src="/js/main.js"></script>
    <script src="/js/language-swithcher.js"></script>
    <script type="module" src="/js/product-detail.js"></script>

    
</body>
</html>
